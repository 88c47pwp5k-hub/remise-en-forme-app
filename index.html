<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ea580c" />
  <meta name="description" content="Ta remise en forme — programme quotidien HIIT, nutrition, étirement." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Remise en forme" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192-v2.png" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- Tabler Icons (webfont) — licence MIT -->
  <link rel="stylesheet" href="css/tabler-icons.css" />
  <link rel="stylesheet" href="css/assistant.css" />
  <title>Ta remise en forme</title>
  <style>
    body { padding-bottom: env(safe-area-inset-bottom); }
    .home-hero { padding-top: max(var(--space-xl), env(safe-area-inset-top, 0px) + var(--space-xl)); }
  </style>
</head>
<body>

  <main>
    <section class="home-hero" aria-label="Accueil">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-sm)">
        <div>
          <h1>Ta remise en forme 💪</h1>
          <p class="greeting">Choisis ton module pour aujourd'hui.</p>
        </div>
        <button id="btn-export" type="button" title="Exporter toutes mes données"
          style="flex-shrink:0;margin-top:4px;padding:6px 12px;background:var(--surface-card);border:1px solid var(--disabled-border);border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:700;color:var(--text-secondary);cursor:pointer;white-space:nowrap">
          💾 Exporter
        </button>
      </div>
    </section>

    <div class="modules-grid" role="list">

      <!-- Exercice — actif -->
      <a href="modules/exercice.html"
         class="module-card active"
         role="listitem"
         aria-label="Module Exercice — Circuit HIIT du jour">
        <span class="card-icon" aria-hidden="true">🏋️</span>
        <span class="card-label">Exercice</span>
        <span class="card-sub">Circuit HIIT du jour</span>
      </a>

      <!-- Nutrition — actif -->
      <a href="modules/nutrition.html"
         class="module-card active"
         role="listitem"
         aria-label="Module Nutrition — suivi du jour">
        <span class="card-icon" aria-hidden="true">🥗</span>
        <span class="card-label">Nutrition</span>
        <span class="card-sub">Repas · Alcool · Sommeil</span>
      </a>

      <!-- Étirement — actif -->
      <a href="modules/etirement.html"
         class="module-card active"
         role="listitem"
         aria-label="Module Étirement — routine quotidienne">
        <span class="card-icon" aria-hidden="true">🧘</span>
        <span class="card-label">Étirement</span>
        <span class="card-sub">Mobilité & souplesse</span>
      </a>

      <!-- Hydratation — actif -->
      <a href="modules/hydratation.html"
         class="module-card active"
         role="listitem"
         aria-label="Module Hydratation — suivi eau quotidien">
        <span class="card-icon" aria-hidden="true">💧</span>
        <span class="card-label">Hydratation</span>
        <span class="card-sub">Suivi eau quotidien</span>
      </a>

      <!-- Portugais — actif -->
      <a href="modules/portugais.html"
         class="module-card active"
         role="listitem"
         aria-label="Module Portugais — Préparer le voyage au Brésil">
        <span class="card-icon" aria-hidden="true">🇧🇷</span>
        <span class="card-label">Portugais</span>
        <span class="card-sub">Mots & phrases pour le Brésil</span>
      </a>

      <!-- Suivi corporel — actif -->
      <a href="modules/suivi.html"
         class="module-card active"
         role="listitem"
         aria-label="Module Suivi — tour de taille et poids">
        <span class="card-icon" aria-hidden="true">📏</span>
        <span class="card-label">Suivi</span>
        <span class="card-sub">Tour de taille & poids</span>
      </a>

    </div>
  </main>

  <script>
    // Enregistrement du Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    }

    // Export localStorage → fichier JSON
    document.getElementById('btn-export').addEventListener('click', () => {
      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        try { data[key] = JSON.parse(localStorage.getItem(key)); }
        catch { data[key] = localStorage.getItem(key); }
      }
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `remise-en-forme-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
  <script src="js/assistant.js" defer></script>

</body>
</html>
